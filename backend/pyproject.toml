[project]
name = "backend"
version = "0.1.0"
description = "FastAPI + PostgreSQL backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "assemblyai>=1.6.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.3",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# Revision scripts are generated from alembic's template, not hand-written.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
