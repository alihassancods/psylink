services:
  db:
    image: postgres:16-alpine
    container_name: backend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
      POSTGRES_DB: backend
    ports:
      # 5433 on the host: 5432 is already taken by an unrelated project's postgres.
      # Bound to loopback only so it is not exposed on the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
